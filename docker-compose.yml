services:
  churn-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: telco-churn-api:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Persist the prediction log used for drift monitoring.
      - ./data/prediction_logs:/app/data/prediction_logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
