[project]
name = "telco-churn-ml-system"
version = "1.0.0"
description = "Production-grade end-to-end churn prediction system (data -> training -> API -> monitoring)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that require the trained production artifact",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # long lines ok; FastAPI dependency defaults are fine

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
files = ["src"]
